<!doctype html>
<html lang="en">
  <head>

  <body>
    <!-- 03 Scoped storage. The lifecycle is the product; show the whole arc. -->
    <div class="card">
      <div class="wordmark"><span class="box"></span><span>STOW <b>S3</b></span></div>

      <h1 class="mt">One call.<br /><em>Private S3.</em></h1>

      <div class="steps">
        <div class="call">withStow()</div>
        <div class="chev">&#10230;</div>
        <div class="step">start</div>
        <div class="chev">&#10230;</div>
        <div class="step on">bucket</div>
        <div class="chev">&#10230;</div>
        <div class="step on">your code</div>
        <div class="chev">&#10230;</div>
        <div class="step">cleanup</div>
      </div>

      <p class="sub" style="max-width: 60ch; font-size: 40px; margin-top: 62px">
        The server and its data are gone before the call returns. It cannot
        inherit your cloud configuration.
      </p>

      <div class="foot">
        <span class="tag">TypeScript &middot; Python</span>
        <span class="url">github.com/chester-hill-solutions/stow-s3</span>
      </div>
    </div>
  </body>
</html>
