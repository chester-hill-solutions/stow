name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  # GitHub Packages is the registry this organisation publishes to, and the
  # built-in GITHUB_TOKEN may publish packages belonging to this repository.
  # That is why no npm secret exists anywhere in this workflow.
  packages: write

jobs:
  test:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/stow-s3/package-lock.json
      - name: Verify tests
        run: make test-all
      - name: Verify build and standards
        run: |
          make build
          make standards
      - name: Verify generated output
        run: make check-generated
      - name: Pack verified npm package
        working-directory: packages/stow-s3
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package"
      - name: Upload verified npm package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error

  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            platform_tag: manylinux_2_17_x86_64
          - os: linux
            arch: arm64
            platform_tag: manylinux_2_17_aarch64
          - os: darwin
            arch: amd64
            platform_tag: macosx_11_0_x86_64
          - os: darwin
            arch: arm64
            platform_tag: macosx_11_0_arm64
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: .go-version
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o stow-s3 ./cmd/stow-s3

      - name: Package
        run: tar -czf stow-${{ matrix.os }}-${{ matrix.arch }}.tar.gz stow-s3 LICENSE README.md

      # The wheel force-includes the binary, so a wheel is only correct for the
      # one platform it was built against. Building it here, in the matrix entry
      # that already holds the right binary, is what keeps a published wheel and
      # its binary from coming from different builds. The wheel is tagged for
      # that platform rather than left as py3-none-any, because a pure-python tag
      # would let pip install a Linux binary on macOS and fail at run time.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          set -euo pipefail
          mkdir -p bin
          install -m 0755 stow-s3 "bin/stow-s3"
          python -m pip install --quiet --upgrade "hatchling>=1.21" build
          python scripts/build-python-wheel.py \
            --target "${{ matrix.os }}-${{ matrix.arch }}" \
            --out "$RUNNER_TEMP/wheel"

      # The tag and the bundled binary's executable bit are the two things that
      # make a wheel correct, and neither is checked by the build backend. A
      # py3-none-any wheel carrying a Linux binary installs on Apple Silicon and
      # then fails to exec, and a non-executable binary fails with a permission
      # error naming neither cause. Assert both here rather than discovering
      # them from a user's bug report.
      - name: Verify wheel
        env:
          WHEEL_PLATFORM_TAG: ${{ matrix.platform_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=("$RUNNER_TEMP"/wheel/*.whl)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            printf 'Expected exactly one wheel, found %d\n' "${#wheels[@]}" >&2
            exit 1
          fi
          wheel="${wheels[0]}"
          case "$(basename "$wheel")" in
            *-"$WHEEL_PLATFORM_TAG".whl) ;;
            *)
              printf 'Wheel %s is not tagged for %s\n' "$(basename "$wheel")" "$WHEEL_PLATFORM_TAG" >&2
              exit 1
              ;;
          esac
          python - "$wheel" <<'PY'
          import stat, sys, zipfile
          archive = zipfile.ZipFile(sys.argv[1])
          binaries = [n for n in archive.namelist() if n.endswith("_bin/stow-s3")]
          if len(binaries) != 1:
              raise SystemExit(f"expected exactly one bundled binary, found {binaries}")
          mode = archive.getinfo(binaries[0]).external_attr >> 16
          # pip only restores the executable bit when the entry is a regular
          # file AND carries an execute bit, so both halves are required.
          if not (stat.S_ISREG(mode) and mode & 0o111):
              raise SystemExit(
                  f"bundled binary mode is {oct(mode)}; pip will not make it "
                  "executable, so every session would fail to start"
              )
          print(f"wheel carries {binaries[0]} at {oct(mode)}")
          PY

      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/wheel/*.whl
          if-no-files-found: error

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stow-${{ matrix.os }}-${{ matrix.arch }}
          path: stow-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  live_gate:
    name: Live provider gate
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/live.yml
    with:
      dry_run: false
      provider: auto
      # Skips rather than fails when no live provider is configured, so a
      # release is possible without live credentials. A skipped gate is not a
      # passed gate, so the release job records which one happened and says so
      # in the release notes. This was `true`, which made every release
      # impossible: the gate hard-fails on absent STOW_LIVE_* secrets, and a
      # gate that can never be satisfied is the same "designed but not wired"
      # failure this repository has hit repeatedly.
      require_configured: false
    secrets:
      STOW_LIVE_ENDPOINT: ${{ secrets.STOW_LIVE_ENDPOINT }}
      STOW_LIVE_ACCESS_KEY_ID: ${{ secrets.STOW_LIVE_ACCESS_KEY_ID }}
      STOW_LIVE_SECRET_ACCESS_KEY: ${{ secrets.STOW_LIVE_SECRET_ACCESS_KEY }}
      STOW_LIVE_SESSION_TOKEN: ${{ secrets.STOW_LIVE_SESSION_TOKEN }}

  release:
    name: Release
    needs: [build, test, live_gate]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # This job runs scripts out of the tree, not just artifacts. Packing the
      # platform packages calls scripts/pack-platform-package.mjs, and the
      # install-surface gate calls scripts/check-install-surface.mjs, so without
      # a checkout the first of those to run dies with MODULE_NOT_FOUND.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download native artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "stow-*"
          path: dist
          merge-multiple: true
      - name: Download verified npm package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: dist/npm

      # GitHub Packages, not npmjs.org. This organisation publishes every one of
      # its packages there and owns no packages on npmjs, where this scope does
      # not exist, so publishing to npmjs returned 404 for a package rather than
      # an authentication error and looked like a naming problem.
      #
      # The token is the built-in GITHUB_TOKEN, which may publish packages
      # belonging to this repository. That is why no npm secret is stored
      # anywhere: there is nothing to leak, rotate, or grant to a user.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      - name: Verify npm package artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          package_files=(dist/npm/*.tgz)
          if [[ "${#package_files[@]}" -ne 1 ]]; then
            printf 'Expected exactly one npm package tarball, found %d\n' "${#package_files[@]}" >&2
            exit 1
          fi
          package_file="${package_files[0]}"
          package_metadata="$(tar -xOf "$package_file" package/package.json)"
          node -e '
            const metadata = JSON.parse(process.argv[1]);
            const expectedVersion = process.argv[2];
            if (metadata.name !== "@chester-hill-solutions/stow-s3" || metadata.version !== expectedVersion) {
              throw new Error(`Unexpected npm package metadata: ${metadata.name}@${metadata.version}`);
            }
          ' "$package_metadata" "${GITHUB_REF_NAME#v}"
          tar -tzf "$package_file" > "$RUNNER_TEMP/npm-package-files.txt"
          grep -Fxq package/dist/stow-runtime.wasm "$RUNNER_TEMP/npm-package-files.txt"
          grep -Fxq package/dist/wasm_exec.js "$RUNNER_TEMP/npm-package-files.txt"

      # Each platform package carries the native binary for exactly one os/cpu
      # pair. They are packed from the artifacts this same run built, so a
      # published binary and the JavaScript that resolves it always come from
      # one commit.
      - name: Pack platform packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          expected_version="${GITHUB_REF_NAME#v}"
          for archive in dist/stow-*.tar.gz; do
            node scripts/pack-platform-package.mjs "$archive" dist/npm-platform
          done
          mapfile -t platform_tarballs < <(ls dist/npm-platform/*.tgz)
          if [[ "${#platform_tarballs[@]}" -ne 4 ]]; then
            printf 'Expected four platform packages, found %d\n' "${#platform_tarballs[@]}" >&2
            exit 1
          fi
          for tarball in "${platform_tarballs[@]}"; do
            metadata="$(tar -xOf "$tarball" package/package.json)"
            node -e '
              const metadata = JSON.parse(process.argv[1]);
              const expectedVersion = process.argv[2];
              if (metadata.version !== expectedVersion) {
                throw new Error(`Platform package version skew: ${metadata.name}@${metadata.version}`);
              }
            ' "$metadata" "$expected_version"
            # The listing is captured rather than piped into grep -q. These
            # tarballs carry an 11 MB binary, so tar is still skipping it when
            # grep has already matched the first entry and exited; it takes a
            # SIGPIPE, and `set -o pipefail` turns that into a failed release.
            tar -tzf "$tarball" > "$RUNNER_TEMP/platform-tarball-files.txt"
            grep -Fxq package/bin/stow-s3 "$RUNNER_TEMP/platform-tarball-files.txt"
          done
          ls -l dist/npm-platform

      # A release is the one place where "is this actually published" is a
      # question about the world rather than about the tree, so it is the one
      # place worth asking a registry. This is what would have caught issue #3
      # before the install instructions shipped pointing at nothing.
      - name: Check the documented install surface against the registries
        run: node scripts/check-install-surface.mjs --online

      # The live gate skips when no provider is configured, so the release has
      # to say out loud whether it was verified or skipped. Publishing a release
      # whose notes imply a live-provider check that never ran is the same class
      # of quiet failure as a gate that cannot be satisfied at all.
      - name: Record live-provider gate status
        id: live
        env:
          STOW_LIVE_ENDPOINT: ${{ secrets.STOW_LIVE_ENDPOINT }}
        run: |
          set -euo pipefail
          if [[ -n "${STOW_LIVE_ENDPOINT:-}" ]]; then
            echo "status=verified against the configured live provider" >> "$GITHUB_OUTPUT"
          else
            echo "status=SKIPPED - no live provider was configured, so this release is NOT verified against one" >> "$GITHUB_OUTPUT"
            echo "::warning title=Live provider gate skipped::No STOW_LIVE_ENDPOINT is configured, so this release was published without a live-provider check."
          fi

      - name: Publish npm package
        # No --provenance: npm provenance attestations are generated by the
        # registry, and only npmjs implements them. GitHub Packages does not,
        # so the flag attests to nothing here. Provenance for these packages
        # comes from the repository link in package.json plus the fact that the
        # publishing workflow is the only thing with permission to write them.
        run: npm publish --ignore-scripts --access public ./dist/npm/*.tgz

      - name: Publish platform packages
        run: npm publish --ignore-scripts --access public ./dist/npm-platform/*.tgz

      # PyPI, by trusted publishing from this workflow's OIDC identity, so there
      # is no API token to store. Every matrix entry contributes one wheel and
      # the set must cover the four supported platforms, or a user on a missing
      # one gets "no matching distribution" instead of an install.
      - name: Download wheels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "wheel-*"
          path: dist/wheel
          merge-multiple: true

      - name: Verify wheel set
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/wheel/*.whl)
          if [[ "${#wheels[@]}" -ne 4 ]]; then
            printf 'Expected four platform wheels, found %d\n' "${#wheels[@]}" >&2
            exit 1
          fi
          for tag in manylinux_2_17_x86_64 manylinux_2_17_aarch64 macosx_11_0_x86_64 macosx_11_0_arm64; do
            found=0
            for wheel in "${wheels[@]}"; do
              [[ "$(basename "$wheel")" == *-"$tag".whl ]] && found=1
            done
            if [[ "$found" -ne 1 ]]; then
              printf 'Expected exactly one wheel tagged %s\n' "$tag" >&2
              exit 1
            fi
          done
          ls -l dist/wheel

      # PyPI is off until a trusted publisher is configured for this project on
      # pypi.org. A step that can never succeed is the same "designed but not
      # wired" failure the live-provider gate used to be, and because the
      # GitHub Release comes after this step, a hard failure here would publish
      # to npm and then produce no release at all. The skip is recorded and
      # printed in the release notes rather than passing silently.
      - name: Record PyPI publishing status
        id: pypi
        env:
          STOW_PUBLISH_PYPI: ${{ vars.STOW_PUBLISH_PYPI }}
        run: |
          set -euo pipefail
          if [[ "${STOW_PUBLISH_PYPI:-}" == "true" ]]; then
            echo "status=enabled" >> "$GITHUB_OUTPUT"
          else
            echo "status=SKIPPED - no PyPI trusted publisher is configured, so stow-s3 was NOT published to PyPI" >> "$GITHUB_OUTPUT"
            echo "::warning title=PyPI publishing skipped::STOW_PUBLISH_PYPI is not set to true, so this release did not publish to PyPI."
          fi

      - name: Publish to PyPI
        if: steps.pypi.outputs.status == 'enabled'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/wheel
          # attestations prove the wheel came from this workflow rather than
          # from somebody with upload access, which is the whole point of using
          # trusted publishing instead of a long-lived token.
          attestations: true
      - name: Checksums
        run: |
          cd dist
          sha256sum stow-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: |
            dist/stow-*.tar.gz
            dist/SHA256SUMS.txt
          body: |
            ## stow ${{ github.ref_name }}

            Docker-free, S3-compatible bucket service for development and tests. PGLite-inspired: install a package, start an endpoint, point the AWS SDK at it.

            **Scope:** local and run-through caching for apps — not production object storage.

            ### Usage

            ```bash
            stow-s3 serve --port 0 --data-dir .stow
            ```

            Parse the `STOW_READY` line for `endpoint`, `access_key`, and `secret_key`. Create buckets with the AWS SDK (path-style, region `us-east-1`).

            ### Artifacts

            | Asset | Platform |
            |-------|----------|
            | `stow-linux-amd64.tar.gz` | Linux x86_64 |
            | `stow-linux-arm64.tar.gz` | Linux ARM64 |
            | `stow-darwin-amd64.tar.gz` | macOS x86_64 |
            | `stow-darwin-arm64.tar.gz` | macOS Apple Silicon |

            Checksums for all artifacts are in `SHA256SUMS.txt`.

            The Go, TypeScript, and shared corpus gates must pass before this tag
            is published.

            Live-provider gate: ${{ steps.live.outputs.status }}

            PyPI: ${{ steps.pypi.outputs.status }}
