name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/stow/package-lock.json
      - name: Verify tests
        run: make test-all
      - name: Verify build and standards
        run: |
          make build
          make standards
      - name: Verify generated output
        run: make check-generated

  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o stow ./cmd/stow

      - name: Package
        run: tar -czf stow-${{ matrix.os }}-${{ matrix.arch }}.tar.gz stow LICENSE README.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stow-${{ matrix.os }}-${{ matrix.arch }}
          path: stow-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  live_gate:
    name: Live provider gate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Build
        run: make build
      - name: Run disposable live conformance
        env:
          STOW_CONFORMANCE_UPSTREAM: "1"
          STOW_ENDPOINT: ${{ secrets.STOW_LIVE_ENDPOINT }}
          STOW_ACCESS_KEY_ID: ${{ secrets.STOW_LIVE_ACCESS_KEY_ID }}
          STOW_SECRET_ACCESS_KEY: ${{ secrets.STOW_LIVE_SECRET_ACCESS_KEY }}
          STOW_SESSION_TOKEN: ${{ secrets.STOW_LIVE_SESSION_TOKEN }}
          STOW_LIVE_BUCKET: ${{ vars.STOW_LIVE_BUCKET }}
          STOW_LIVE_BUCKET_PREFIX: ${{ vars.STOW_LIVE_BUCKET_PREFIX }}
        run: make test-conformance

  release:
    name: Release
    needs: [build, test, live_gate]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/stow/package-lock.json
      - name: Verify package metadata
        working-directory: packages/stow
        run: |
          test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME#v}"
          npm ci
          npm test
      - name: Publish npm package
        working-directory: packages/stow
        run: npm publish --access public --provenance
      - name: Checksums
        run: |
          cd dist
          sha256sum stow-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/stow-*.tar.gz
            dist/SHA256SUMS.txt
          body: |
            ## stow ${{ github.ref_name }}

            Docker-free, S3-compatible bucket service for development and tests. PGLite-inspired: install a package, start an endpoint, point the AWS SDK at it.

            **Scope:** local and run-through caching for apps — not production object storage.

            ### Usage

            ```bash
            stow serve --port 0 --data-dir .stow
            ```

            Parse the `STOW_READY` line for `endpoint`, `access_key`, and `secret_key`. Create buckets with the AWS SDK (path-style, region `us-east-1`).

            ### Artifacts

            | Asset | Platform |
            |-------|----------|
            | `stow-linux-amd64.tar.gz` | Linux x86_64 |
            | `stow-linux-arm64.tar.gz` | Linux ARM64 |
            | `stow-darwin-amd64.tar.gz` | macOS x86_64 |
            | `stow-darwin-arm64.tar.gz` | macOS Apple Silicon |

            Checksums for all artifacts are in `SHA256SUMS.txt`.

            The Go, TypeScript, shared corpus, and live-provider gates must pass before this tag is published.
