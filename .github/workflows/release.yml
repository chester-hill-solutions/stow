name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24"
          cache: true
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/stow/package-lock.json
      - name: Verify tests
        run: make test-all
      - name: Verify build and standards
        run: |
          make build
          make standards
      - name: Verify generated output
        run: make check-generated
      - name: Pack verified npm package
        working-directory: packages/stow
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package"
      - name: Upload verified npm package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error

  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24"
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o stow ./cmd/stow

      - name: Package
        run: tar -czf stow-${{ matrix.os }}-${{ matrix.arch }}.tar.gz stow LICENSE README.md

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stow-${{ matrix.os }}-${{ matrix.arch }}
          path: stow-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  live_gate:
    name: Live provider gate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24"
          cache: true
      - name: Build
        run: make build
      - name: Run disposable live conformance
        env:
          STOW_CONFORMANCE_UPSTREAM: "1"
          STOW_ENDPOINT: ${{ secrets.STOW_LIVE_ENDPOINT }}
          STOW_ACCESS_KEY_ID: ${{ secrets.STOW_LIVE_ACCESS_KEY_ID }}
          STOW_SECRET_ACCESS_KEY: ${{ secrets.STOW_LIVE_SECRET_ACCESS_KEY }}
          STOW_SESSION_TOKEN: ${{ secrets.STOW_LIVE_SESSION_TOKEN }}
          STOW_LIVE_BUCKET: ${{ vars.STOW_LIVE_BUCKET }}
          STOW_LIVE_BUCKET_PREFIX: ${{ vars.STOW_LIVE_BUCKET_PREFIX }}
        run: make test-conformance

  release:
    name: Release
    needs: [build, test, live_gate]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download native artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "stow-*"
          path: dist
          merge-multiple: true
      - name: Download verified npm package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: dist/npm

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify npm package artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          package_files=(dist/npm/*.tgz)
          if [[ "${#package_files[@]}" -ne 1 ]]; then
            printf 'Expected exactly one npm package tarball, found %d\n' "${#package_files[@]}" >&2
            exit 1
          fi
          package_file="${package_files[0]}"
          package_metadata="$(tar -xOf "$package_file" package/package.json)"
          node -e '
            const metadata = JSON.parse(process.argv[1]);
            const expectedVersion = process.argv[2];
            if (metadata.name !== "@chs/stow" || metadata.version !== expectedVersion) {
              throw new Error(`Unexpected npm package metadata: ${metadata.name}@${metadata.version}`);
            }
          ' "$package_metadata" "${GITHUB_REF_NAME#v}"
          tar -tzf "$package_file" > "$RUNNER_TEMP/npm-package-files.txt"
          grep -Fxq package/dist/stow-runtime.wasm "$RUNNER_TEMP/npm-package-files.txt"
          grep -Fxq package/dist/wasm_exec.js "$RUNNER_TEMP/npm-package-files.txt"
      - name: Publish npm package
        run: npm publish --ignore-scripts --access public --provenance ./dist/npm/*.tgz
      - name: Checksums
        run: |
          cd dist
          sha256sum stow-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: |
            dist/stow-*.tar.gz
            dist/SHA256SUMS.txt
          body: |
            ## stow ${{ github.ref_name }}

            Docker-free, S3-compatible bucket service for development and tests. PGLite-inspired: install a package, start an endpoint, point the AWS SDK at it.

            **Scope:** local and run-through caching for apps — not production object storage.

            ### Usage

            ```bash
            stow serve --port 0 --data-dir .stow
            ```

            Parse the `STOW_READY` line for `endpoint`, `access_key`, and `secret_key`. Create buckets with the AWS SDK (path-style, region `us-east-1`).

            ### Artifacts

            | Asset | Platform |
            |-------|----------|
            | `stow-linux-amd64.tar.gz` | Linux x86_64 |
            | `stow-linux-arm64.tar.gz` | Linux ARM64 |
            | `stow-darwin-amd64.tar.gz` | macOS x86_64 |
            | `stow-darwin-arm64.tar.gz` | macOS Apple Silicon |

            Checksums for all artifacts are in `SHA256SUMS.txt`.

            The Go, TypeScript, shared corpus, and live-provider gates must pass before this tag is published.
